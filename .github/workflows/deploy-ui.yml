name: Deploy ui to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'packages/ui/**'
      - 'packages/core/**'
      - 'package-lock.json'
      - '.github/workflows/deploy-ui.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let an in-flight run finish rather than cancelling it,
# since a cancelled deploy can leave Pages serving a half-uploaded artifact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm run test

      # ui depends on core's compiled dist/ output (workspace dependency), so build it first.
      - run: npm run build -w @ng-icon-forge/core

      - name: Copy resvg wasm asset
        working-directory: packages/ui
        run: npm run copy-wasm

      - name: Build ui for GitHub Pages
        working-directory: packages/ui
        # Project page, not a user/org root page, so assets must resolve under /ng-icon-forge/.
        run: npx ng build --base-href /ng-icon-forge/

      - name: Disable Jekyll processing
        run: touch packages/ui/dist/ui/browser/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/ui/dist/ui/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
